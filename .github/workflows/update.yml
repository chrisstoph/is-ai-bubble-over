# Rebuilds the page from fresh data every 3 hours and deploys it to GitHub Pages.
# Setup: repo Settings → Pages → Source: "GitHub Actions".
# Optional repo variables (Settings → Secrets and variables → Actions → Variables):
#   SITE_URL, GA_ID, SEC_USER_AGENT, TWITTER_HANDLE
name: Update data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build with live data
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GA_ID: ${{ vars.GA_ID }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          TWITTER_HANDLE: ${{ vars.TWITTER_HANDLE }}
        run: node build.mjs
      # Commit data.json so the "last known value" fallback survives between runs.
      - name: Commit data snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%FT%TZ) [skip ci]"
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
